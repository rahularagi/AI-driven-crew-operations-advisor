services:
  postgres:
    image: postgres:16
    container_name: crew_ops_postgres
    environment:
      POSTGRES_DB: crew_ops
      POSTGRES_USER: crew_ops_user
      POSTGRES_PASSWORD: crew_ops_password
    ports:
      - "5432:5432"
    volumes:
      - crew_ops_postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew_ops_user -d crew_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crew_ops_postgres_data:
